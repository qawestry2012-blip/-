<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тетрис с физикой</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:#05060a;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e8ecff;user-select:none;-webkit-user-select:none}body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}.game-wrap{position:relative;display:flex;gap:22px;align-items:flex-start;padding:14px}canvas{display:block;border-radius:14px;box-shadow:0 0 40px rgba(80,140,255,.25),0 0 0 2px #2a3355 inset;background:#0b0e18}.panel{display:flex;flex-direction:column;gap:14px;width:170px}.card{background:#141a30;border:1px solid #2a3355;border-radius:12px;padding:12px 14px}.card h3{margin:0 0 8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7f8db5;font-weight:600}.big{font-size:28px;font-weight:700;color:#8fd0ff;line-height:1.1}.stat{display:flex;justify-content:space-between;margin:5px 0;font-size:13px}.stat span:last-child{color:#8fd0ff;font-weight:600}#next{margin:0 auto}.hint{font-size:12px;line-height:1.7;color:#6b7699}.hint b{color:#a8b4d8;font-weight:600}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.85);border-radius:18px;z-index:10}#overlay.show{display:flex}.modal{background:#141a30;border:1px solid #2a3355;border-radius:16px;padding:26px 36px;text-align:center;box-shadow:0 0 60px rgba(80,140,255,.3)}.modal h2{margin:0 0 8px;font-size:22px}.modal p{margin:0 0 18px;color:#8f9ac0;font-size:14px}button{background:linear-gradient(135deg,#3b6cff,#6a4dff);color:#fff;border:0;border-radius:10px;padding:11px 26px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.5px;transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(80,120,255,.45)}button:active{transform:translateY(0)}@media (max-width:620px){.game-wrap{flex-direction:column;align-items:center}.panel{width:300px}}
</style>
</head>
<body>
<div class="game-wrap">
<canvas id="board" width="300" height="600"></canvas>
<div class="panel">
<div class="card"><h3>Следующая</h3><canvas id="next" width="140" height="140"></canvas></div>
<div class="card"><h3>Счёт</h3><div class="big" id="score">0</div><div class="stat"><span>Линии</span><span id="lines">0</span></div><div class="stat"><span>Уровень</span><span id="level">1</span></div><div class="stat"><span>Скорость</span><span id="speed">1.0x</span></div></div>
<div class="card hint"><b>← →</b> движение<br><b>↑ / X</b> поворот<br><b>↓</b> мягкое падение<br><b>Пробел</b> сброс<br><b>P</b> пауза</div>
</div>
<div id="overlay"><div class="modal"><h2 id="ovTitle">Пауза</h2><p id="ovText">Нажмите кнопку, чтобы продолжить</p><button id="ovBtn">Продолжить</button></div></div>
</div>
<script type="module">
const BW=300,BH=600,NW=140,NH=140;
const wqab=document.getElementById('board'),nqwe=document.getElementById('next');
const dpr=Math.min(window.devicePixelRatio||1,2);
function setupCanvas(c,w,h){c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return x;}
const ctx=setupCanvas(wqab,BW,BH);
const nctx=setupCanvas(nqwe,NW,NH);
if(!ctx||!nctx){document.body.innerHTML='<h2 style="color:#ff6b6b;text-align:center;padding:40px">Canvas 2D не поддерживается</h2>';throw new Error('no ctx');}
const COLS=10,ROWS=20,CELL=30;
const SHAPES={I:{color:'#38e8ff',cells:[[0,0],[1,0],[2,0],[3,0]],size:4},J:{color:'#4f7dff',cells:[[0,0],[0,1],[1,1],[2,1]],size:3},L:{color:'#ff9a3c',cells:[[2,0],[0,1],[1,1],[2,1]],size:3},O:{color:'#ffe34f',cells:[[0,0],[1,0],[0,1],[1,1]],size:2},S:{color:'#4dff88',cells:[[1,0],[2,0],[0,1],[1,1]],size:3},T:{color:'#c96bff',cells:[[1,0],[0,1],[1,1],[2,1]],size:3},Z:{color:'#ff4d6b',cells:[[0,0],[1,0],[1,1],[2,1]],size:3}};
const TYPES=Object.keys(SHAPES);
const rnd=n=>Math.floor(Math.random()*n),clp=(v,a,b)=>v<a?a:v>b?b:v,lrp=(a,b,t)=>a+(b-a)*t;
const PHYSICS={baseSpeed:1.2,speedPerLevel:0.55,maxSpeed:12,softDropFirst:55,softDropRate:45,lockDelay:380,dAS:130,arr:45};
const bgLayer=document.createElement('canvas');
const bgCtx=bgLayer.getContext('2d');
function buildBg(){bgLayer.width=BW*dpr;bgLayer.height=BH*dpr;bgCtx.setTransform(dpr,0,0,dpr,0,0);const g=bgCtx.createLinearGradient(0,0,0,BH);g.addColorStop(0,'#0d1120');g.addColorStop(1,'#080a12');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,BW,BH);bgCtx.strokeStyle='rgba(90,120,200,.07)';bgCtx.lineWidth=1;for(let x=1;x<COLS;x++){bgCtx.beginPath();bgCtx.moveTo(x*CELL,0);bgCtx.lineTo(x*CELL,BH);bgCtx.stroke();}for(let y=1;y<ROWS;y++){bgCtx.beginPath();bgCtx.moveTo(0,y*CELL);bgCtx.lineTo(BW,y*CELL);bgCtx.stroke();}}
buildBg();
class Piece{constructor(t){const s=SHAPES[t];this.type=t;this.size=s.size;this.color=s.color;this.cells=s.cells.map(([x,y])=>({x,y}));this.x=Math.floor((COLS-s.size)/2);const mY=Math.min(...this.cells.map(c=>c.y));this.y=-mY;this.px=this.x;this.py=this.y;this.tilt=0;this.tiltVel=0;this.rotAnim=0;this.rotAnimVel=0;this.fallSpeed=0;this.fallAccum=0;this.lockedTimer=0;this.touchingGround=false;}rotatedCells(d){const s=this.size;return this.cells.map(({x,y})=>d>0?{x:s-1-y,y:x}:{x:y,y:s-1-x});}}
class Game{constructor(){this.reset();}reset(){this.grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));this.score=0;this.lines=0;this.level=1;this.paused=false;this.gameOver=false;this._overShown=false;this.piece=null;this.nextType=TYPES[rnd(TYPES.length)];this.bag=[];this.effects=[];this.lockFlash=[];this.shake=0;this.keys={left:false,right:false,down:false};this.dasTimer=0;this.arrTimer=0;this.lastMoveDir=0;this.downTimer=0;this.downFirst=true;this.spawn();}nextFromBag(){if(this.bag.length===0){this.bag=[...TYPES];for(let i=this.bag.length-1;i>0;i--){const j=rnd(i+1);[this.bag[i],this.bag[j]]=[this.bag[j],this.bag[i]];}}return this.bag.pop();}spawn(){const t=this.nextType;this.nextType=this.nextFromBag();const p=new Piece(t);if(this.collides(p,p.x,p.y,p.cells)){this.gameOver=true;return;}this.piece=p;this.downTimer=0;this.downFirst=true;this.dasTimer=0;this.arrTimer=0;this.lastMoveDir=0;}collides(p,px,py,cells){for(const c of cells){const x=px+c.x,y=py+c.y;if(x<0||x>=COLS||y>=ROWS)return true;if(y>=0&&this.grid[y][x])return true;}return false;}isGrounded(p,px,py,cells){return this.collides(p,px,py+1,cells);}move(dx){const p=this.piece;if(!p)return false;if(!this.collides(p,p.x+dx,p.y,p.cells)){p.x+=dx;p.tiltVel+=dx*0.5;return true;}return false;}rotate(d){const p=this.piece;if(!p)return false;const nC=p.rotatedCells(d),kicks=[0,-1,1,-2,2];for(const k of kicks){if(!this.collides(p,p.x+k,p.y,nC)){p.x+=k;p.cells=nC;p.rotAnimVel+=d*1.4;return true;}if(!this.collides(p,p.x+k,p.y-1,nC)){p.x+=k;p.y-=1;p.cells=nC;p.rotAnimVel+=d*1.4;return true;}}return false;}hardDrop(){const p=this.piece;if(!p)return;let d=0;while(!this.collides(p,p.x,p.y+1,p.cells)){p.y++;d++;}p.fallSpeed=0;p.fallAccum=0;this.shake=Math.min(8,2+d*0.4);this.lockPiece();}softStep(){const p=this.piece;if(!p)return false;if(!this.collides(p,p.x,p.y+1,p.cells)){p.y++;p.fallSpeed=0;p.fallAccum=0;p.lockedTimer=0;return true;}return false;}lockPiece(){const p=this.piece;if(!p)return;let aT=true;for(const c of p.cells){const x=p.x+c.x,y=p.y+c.y;if(y>=0){this.grid[y][x]={color:p.color,flash:1};aT=false;}}for(const c of p.cells){const x=p.x+c.x,y=p.y+c.y;if(y>=0)this.lockFlash.push({x,y,life:1,color:p.color});}this.piece=null;if(aT){this.gameOver=true;return;}this.clearLines();this.spawn();}clearLines(){let c=0;for(let y=ROWS-1;y>=0;y--){if(this.grid[y].every(cell=>cell)){for(let x=0;x<COLS;x++){this.effects.push({x:x*CELL+CELL/2,y:y*CELL+CELL/2,vx:(Math.random()-0.5)*0.35,vy:(Math.random()-0.9)*0.35,life:1,color:this.grid[y][x].color,size:3+Math.random()*5});}this.grid.splice(y,1);this.grid.unshift(Array(COLS).fill(null));c++;y++;}}if(c>0){const p=[0,100,300,500,800][c];this.score+=p*this.level;this.lines+=c;const nl=Math.floor(this.lines/10)+1;if(nl!==this.level){this.level=nl;this.shake=Math.max(this.shake,6);}this.shake=Math.max(this.shake,c*3);}}update(dt){if(this.paused||this.gameOver)return;const k=dt/16;this.shake*=Math.pow(0.92,k);if(this.shake<0.1)this.shake=0;if(this.effects.length)this.effects=this.effects.filter(e=>{e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=0.0025*dt;e.life-=dt/600;return e.life>0;});if(this.lockFlash.length)this.lockFlash=this.lockFlash.filter(f=>{f.life-=dt/320;return f.life>0;});for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=this.grid[y][x];if(c&&c.flash>0)c.flash-=dt/200;}const p=this.piece;if(!p)return;const dir=(this.keys.right?1:0)-(this.keys.left?1:0);if(dir!==0){if(dir!==this.lastMoveDir){this.lastMoveDir=dir;this.dasTimer=0;this.arrTimer=0;this.move(dir);}else{this.dasTimer+=dt;if(this.dasTimer>=PHYSICS.dAS){this.arrTimer+=dt;while(this.arrTimer>=PHYSICS.arr){this.arrTimer-=PHYSICS.arr;this.move(dir);}}}}else{this.lastMoveDir=0;this.dasTimer=0;this.arrTimer=0;}if(this.keys.down){this.downTimer+=dt;const t=this.downFirst?PHYSICS.softDropFirst:PHYSICS.softDropRate;while(this.downTimer>=t){this.downTimer-=t;this.downFirst=false;if(!this.softStep())break;}}else{this.downTimer=0;this.downFirst=true;}if(!this.piece)return;const cur=this.piece;const spd=Math.min(PHYSICS.maxSpeed,PHYSICS.baseSpeed+(this.level-1)*PHYSICS.speedPerLevel);const gnd=this.isGrounded(cur,cur.x,cur.y,cur.cells);if(gnd){cur.touchingGround=true;cur.fallSpeed=0;cur.fallAccum=0;cur.lockedTimer+=dt;if(cur.lockedTimer>=PHYSICS.lockDelay){this.lockPiece();return;}}else{cur.touchingGround=false;cur.lockedTimer=0;cur.fallSpeed=spd;cur.fallAccum+=cur.fallSpeed*dt/1000;while(cur.fallAccum>=1){if(!this.collides(cur,cur.x,cur.y+1,cur.cells)){cur.y++;cur.fallAccum-=1;}else{cur.fallAccum=0;break;}}}const canFall=!this.collides(cur,cur.x,cur.y+1,cur.cells);const targetX=cur.x;const targetY=cur.y+(canFall?cur.fallAccum:0);const kx=dt/120,ky=dt/120;cur.px=lrp(cur.px,targetX,clp(kx,0,1));cur.py=lrp(cur.py,targetY,clp(ky,0,1));if(Math.abs(targetX-cur.px)<0.001)cur.px=targetX;if(Math.abs(targetY-cur.py)<0.001)cur.py=targetY;cur.tiltVel*=Math.pow(0.8,k);cur.tilt=clp(cur.tilt+cur.tiltVel*dt*0.02,-0.16,0.16);if(Math.abs(cur.tilt)<0.001&&Math.abs(cur.tiltVel)<0.001){cur.tilt=0;cur.tiltVel=0;}cur.rotAnimVel*=Math.pow(0.7,k);cur.rotAnim+=cur.rotAnimVel*dt*0.02;cur.rotAnim+=-cur.rotAnim*Math.min(1,dt/40);if(Math.abs(cur.rotAnim)<0.0008&&Math.abs(cur.rotAnimVel)<0.0008){cur.rotAnim=0;cur.rotAnimVel=0;}}draw(){ctx.clearRect(0,0,BW,BH);ctx.drawImage(bgLayer,0,0,BW,BH);ctx.save();if(this.shake>0.1){ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake);}for(let y=0;y<ROWS;y++){const row=this.grid[y];for(let x=0;x<COLS;x++){const c=row[x];if(c)this.drawBlock(x*CELL,y*CELL,c.color,CELL,c.flash||0);}}if(this.lockFlash.length)for(const f of this.lockFlash){ctx.save();ctx.globalAlpha=f.life*0.8;ctx.fillStyle='#fff';ctx.shadowColor=f.color;ctx.shadowBlur=18;ctx.fillRect(f.x*CELL+3,f.y*CELL+3,CELL-6,CELL-6);ctx.restore();}const p=this.piece;if(p){this.drawGhost(p);const ox=p.px*CELL,oy=p.py*CELL,cx=ox+p.size*CELL/2,cy=oy+p.size*CELL/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(p.rotAnim);ctx.translate(-cx,-cy);ctx.translate(p.tilt*16,0);ctx.save();ctx.beginPath();ctx.rect(-40,-40,BW+80,BH+80);ctx.clip();for(const c of p.cells){const by=oy+c.y*CELL;if(by+CELL<-40||by>BH+40)continue;this.drawBlock(ox+c.x*CELL,by,p.color,CELL,0,true);}ctx.restore();ctx.restore();}if(this.effects.length)for(const e of this.effects){if(e.y<-20||e.y>BH+20)continue;ctx.save();ctx.globalAlpha=e.life;ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(e.x,e.y,e.size*e.life,0,Math.PI*2);ctx.fill();ctx.restore();}ctx.restore();}drawBlock(x,y,color,size,flash=0,active=false){if(y+size<-40||y>BH+40)return;const r=5;if(active){ctx.shadowColor=color;ctx.shadowBlur=14;}else{ctx.shadowBlur=0;}const g=ctx.createLinearGradient(x,y,x+size,y+size);g.addColorStop(0,this.lighten(color,0.35+flash*0.4));g.addColorStop(0.5,color);g.addColorStop(1,this.darken(color,0.35));ctx.fillStyle=g;this.roundRect(x+1.5,y+1.5,size-3,size-3,r);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,'+(0.18+flash*0.5)+')';this.roundRect(x+4,y+4,size-12,(size-12)*0.35,r*0.7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;this.roundRect(x+1.5,y+1.5,size-3,size-3,r);ctx.stroke();}drawGhost(p){let gy=p.y;while(!this.collides(p,p.x,gy+1,p.cells))gy++;if(gy===p.y||gy<0)return;ctx.save();ctx.globalAlpha=0.16;ctx.strokeStyle=p.color;ctx.lineWidth=2;for(const c of p.cells){const x=(p.x+c.x)*CELL,y=(gy+c.y)*CELL;if(y+CELL<0)continue;this.roundRect(x+3,y+3,CELL-6,CELL-6,5);ctx.stroke();}ctx.restore();}roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}lighten(h,a){return this.mix(h,'#ffffff',a);}darken(h,a){return this.mix(h,'#000000',a);}mix(a,b,t){const pa=this.parseHex(a),pb=this.parseHex(b);return`rgb(${Math.round(lrp(pa[0],pb[0],t))},${Math.round(lrp(pa[1],pb[1],t))},${Math.round(lrp(pa[2],pb[2],t))})`;}parseHex(h){if(h.startsWith('#')){const v=h.slice(1);if(v.length===3)return[parseInt(v[0]+v[0],16),parseInt(v[1]+v[1],16),parseInt(v[2]+v[2],16)];return[parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)];}const m=h.match(/\d+/g);return m?m.map(Number):[255,255,255];}drawNext(){nctx.clearRect(0,0,NW,NH);const s=SHAPES[this.nextType],cell=28,w=s.size*cell,ox=(NW-w)/2,oy=(NH-w)/2;nctx.save();nctx.shadowColor=s.color;nctx.shadowBlur=16;for(const[cx,cy]of s.cells){const g=nctx.createLinearGradient(ox+cx*cell,oy+cy*cell,ox+(cx+1)*cell,oy+(cy+1)*cell);g.addColorStop(0,this.lighten(s.color,0.35));g.addColorStop(1,this.darken(s.color,0.25));nctx.fillStyle=g;this.roundRectOn(nctx,ox+cx*cell+2,oy+cy*cell+2,cell-4,cell-4,5);nctx.fill();nctx.shadowBlur=0;nctx.fillStyle='rgba(255,255,255,.2)';this.roundRectOn(nctx,ox+cx*cell+5,oy+cy*cell+5,cell-14,(cell-14)*0.35,3);nctx.fill();}nctx.restore();}roundRectOn(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
const game=new Game();
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),ovBtn=document.getElementById('ovBtn'),scoreEl=document.getElementById('score'),linesEl=document.getElementById('lines'),levelEl=document.getElementById('level'),speedEl=document.getElementById('speed');
let ovAct='resume';
function showOverlay(t,x,b,a){ovTitle.textContent=t;ovText.textContent=x;ovBtn.textContent=b;ovAct=a;overlay.classList.add('show');}
function hideOverlay(){overlay.classList.remove('show');}
ovBtn.addEventListener('click',()=>{if(ovAct==='restart'){hideOverlay();game.reset();accumulator=0;lastTime=performance.now();game.draw();game.drawNext();updateUI();}else{game.paused=false;hideOverlay();}});
const keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyS:'down'};
document.addEventListener('keydown',e=>{if(e.repeat)return;if(game.gameOver){if(e.code==='Space'||e.code==='Enter'){hideOverlay();game.reset();accumulator=0;lastTime=performance.now();}return;}const m=keyMap[e.code];if(m){game.keys[m]=true;if(m==='down'){game.downTimer=0;game.downFirst=true;game.softStep();}e.preventDefault();return;}switch(e.code){case'ArrowUp':case'KeyX':case'KeyW':game.rotate(1);e.preventDefault();break;case'KeyZ':game.rotate(-1);e.preventDefault();break;case'Space':game.hardDrop();e.preventDefault();break;case'KeyP':case'Escape':if(game.paused){game.paused=false;hideOverlay();}else{game.paused=true;showOverlay('Пауза','Игра приостановлена','Продолжить','resume');}e.preventDefault();break;}});
document.addEventListener('keyup',e=>{const m=keyMap[e.code];if(m){game.keys[m]=false;e.preventDefault();}});
let accumulator=0,lastTime=performance.now();
const STEP=1000/120;
function updateUI(){scoreEl.textContent=game.score;linesEl.textContent=game.lines;levelEl.textContent=game.level;speedEl.textContent=(1+(game.level-1)*(PHYSICS.speedPerLevel/PHYSICS.baseSpeed)).toFixed(1)+'x';}
function tick(dt){accumulator+=dt;let s=0;while(accumulator>=STEP&&s<10){game.update(STEP);accumulator-=STEP;s++;}}
let rafWorks=false,rafId=null;
const frameState={lastUi:0};
function loop(now){rafWorks=true;let dt=now-lastTime;lastTime=now;if(dt>100)dt=100;if(dt<0)dt=0;tick(dt);game.draw();if(now-frameState.lastUi>100){game.drawNext();updateUI();frameState.lastUi=now;}if(game.gameOver&&!game._overShown){game._overShown=true;showOverlay('Игра окончена',`Ваш счёт: ${game.score}`,'Заново','restart');}rafId=requestAnimationFrame(loop);}
game.draw();game.drawNext();updateUI();
rafId=requestAnimationFrame(loop);
setTimeout(()=>{if(!rafWorks){if(rafId)cancelAnimationFrame(rafId);let fbLast=performance.now();setInterval(()=>{const now=performance.now();let dt=now-fbLast;fbLast=now;if(dt>100)dt=100;tick(dt);game.draw();if(now-frameState.lastUi>100){game.drawNext();updateUI();frameState.lastUi=now;}if(game.gameOver&&!game._overShown){game._overShown=true;showOverlay('Игра окончена',`Ваш счёт: ${game.score}`,'Заново','restart');}},16);}},350);
</script>
</body>
</html>
